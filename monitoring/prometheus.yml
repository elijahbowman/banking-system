global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'banking-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['banking-service:8080']
        labels:
          application: banking-service
          job: banking-service

  - job_name: 'account-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account-service:8081']
        labels:
          application: account-service
          job: account-service

  # - job_name: 'card-service'
  #   metrics_path: /Prod/actuator/prometheus
  #   scheme: https
  #   static_configs:
  #     - targets: ['card-function.execute-api.us-east-1.amazonaws.com']
  #       labels:
  #         application: card-service

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          application: kafka
          job: kafka-exporter

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          application: host

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml