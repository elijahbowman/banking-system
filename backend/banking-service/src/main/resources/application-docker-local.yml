spring:
  application:
    name: banking-service
  datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect:
  kafka:
    bootstrap-servers:

  h2:
    console:
      enabled: false
      path:
      settings:
        web-allow-others:

logging:
  level:
#    org.springframework.boot.context.config.ConfigDataEnvironment: TRACE
    com.portfolio.banking: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
    org.springframework.jdbc.datasource: INFO
#    io.awspring.cloud.paramstore: DEBUG
    logging:
      level:
        org:
          hibernate:
            type:
              descriptor:
                sql: INFO

  file:
    name: /app/logs/banking-service.log

banking:
  account-service-url: http://account-service:8081
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  tracing:
    sampling:
      probability: 1.0
