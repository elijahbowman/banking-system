version: '3.8'
services:
  banking-service:
    image: ${DOCKERHUB_USERNAME}/banking-service:latest
    container_name: banking-service
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - OTEL_EXPORTER_OTLP_ENDPOINT={ALLOY_BASE_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

