spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  cloud:
    function:
      definition: ${SPRING_CLOUD_FUNCTION_DEFINITION}
    aws:
      dynamodb:
        enabled: true
    openfeign:
      micrometer:
        enabled: true
      okhttp:
        enabled: true

spring.cloud.aws:
  dynamodb:
    endpoint: http://host.docker.internal:4566  # ← LocalStack
  credentials:
    access-key: test
    secret-key: test
  region:
    static: us-east-1

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
        spring.cloud.function: true
        http.client.requests: true
      slo:
        http.client.requests: 50ms,100ms,200ms,500ms,1s,5s
    enable:
      all: true
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true

account:
  service:
    url: http://${ACCOUNT_SERVICE_URL:host.docker.internal:8081}
