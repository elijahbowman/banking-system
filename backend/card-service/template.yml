AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::Serverless-2016-10-31
  - AWS::LanguageExtensions
Description: Card Service - Serverless (Lambda + API Gateway)

Globals:
  Function:
    Timeout: 90
    MemorySize: 2048
    Runtime: java17
#    Tracing: Active
#    Architectures: [x86_64]
    Architectures: [!Ref Architecture]
    Environment:
      Variables:
        SPRING_PROFILES_ACTIVE: lambda
        DEPENDENCY_CHECK_SKIP: ''
        JAVA_TOOL_OPTIONS: !Sub "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
        MAIN_CLASS: com.portfolio.banking.cardservice.CardServiceApplication

Parameters:
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [x86_64, arm64]
    Description: Operating System
  ShadedJarName:
    Type: String
#    Default: card-service-0.0.1-SNAPSHOT-lambda.jar
    Default: card-service-lambda.jar
    Description: Name of the shaded JAR in target/
  DeploymentEnv:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AccountServiceURL:
    Type: String
    Default: host.docker.internal:8081
  KafkaBootstrapServers:
    Type: String
    Default: host.docker.internal:9092
    Description: Kafka bootstrap servers
  KafkaBootstrapServersExportName:
    Type: String
    Default: banking-portfolio-core:KafkaBroker
    Description: Kafka bootstrap servers export name
  KafkaTopic:
    Type: String
    Default: account-created
  ConsumerGroupId:
    Type: String
    Default: card-group
  KafkaAuthType:
    Type: String
    Default: SASL_SCRAM_512_AUTH
  KafkaAuthURI:
    Type: String
    Default: scram://host.docker.internal:9092
  VpcSubnetId:
    Type: String
    Default: subnet-local-dev  # Dev dummy
  VpcSecurityGroupId:
    Type: String
    Default: sg-local-dev  # Dev dummy
  FrontendIpAddress:
    Type: String
    Default: http://localhost:5173  # Local fallback
  FrontendCname:
    Type: String
    Default: http://localhost
  AlloyUrl:
    Type: String
    Default: http://host.docker.internal:4318
  OtelExporterOtlpEndpoint:
    Type: String
    Default: http://host.docker.internal:4318

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for Lambda VPC config
    # No Default — required or provide dummy
  KafkaSubnetId:
    Type: AWS::EC2::Subnet::Id
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  PrivateRouteTableId:
    Type: String

  DeployTimestamp:
    Type: String

Conditions:
  IsArm64: !Equals [ !Ref Architecture, "arm64" ]

Resources:
  CardServiceApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: CardServiceApiFunction
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      Tracing: Active
      CodeUri: .
      Role: !GetAtt LambdaExecutionRole.Arn
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: Prod
      Layers:
        - !If
          - IsArm64
          - !Sub arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroJava:9
          - !Sub arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroJava:9
#        - !If
#          - IsArm64
#          - !Sub arn:aws:lambda:us-east-1:184161586896:layer:opentelemetry-collector-arm64-0_19_0:1
#          - !Sub arn:aws:lambda:us-east-1:184161586896:layer:opentelemetry-collector-amd64-0_19_0:1
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: lambdaRouter
          MAIN_CLASS: com.portfolio.banking.cardservice.CardServiceApplication
          ACCOUNT_SERVICE_URL: !Ref AccountServiceURL
#          ACCOUNT_SERVICE_URL: !Sub '{{resolve:ssm-secure:/banking/backend/account-service/ACCOUNT_SERVICE_URL}}'
          ALLOY_BASE_URL: !Ref AlloyUrl
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_SERVICE_NAME: "card-service-api"
          OTEL_PROPAGATORS: "tracecontext,baggage,b3,xray"
          OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "false"
          OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
##          OTEL_EXPORTER_OTLP_TIMEOUT: "1000"
          OTEL_EXPORTER_OTLP_ENDPOINT: !Ref AlloyUrl
##          OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:4318"
          OTEL_LOGS_EXPORTER: "otlp"
          OTEL_TRACES_EXPORTER: "otlp"
          OTEL_METRICS_EXPORTER: "otlp"
#          OTEL_LOGS_EXPORTER: "console"
#          OTEL_TRACES_EXPORTER: "console"
#          OTEL_METRICS_EXPORTER: "console"
          OTEL_BSP_SCHEDULE_DELAY: "10"
          OTEL_BLRP_SCHEDULE_DELAY: "10"
          OTEL_JAVAAGENT_LOGGING: "application"
          OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
#          OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "CUMULATIVE"
          OTEL_TRACES_SAMPLER: "always_on"
#          OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
          OTEL_INSTRUMENTATION_JDBC_ENABLED: "true"
          OTEL_INSTRUMENTATION_JDBC_DATA_SOURCE_ENABLED: "true"
#          OTEL_INSTRUMENTATION_HIKARI_ENABLED: "true"
#          OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED: "true"
          OTEL_JAVAAGENT_DEBUG: "true"
          OTEL_LOG_LEVEL: "debug"
          OTEL_INSTRUMENTATION_LOGGING_ENABLED: "true"
#          OTEL_JAVAAGENT_EXPERIMENTAL_FIELD_INJECTION_ENABLED: "true"
#          OTEL_JAVAAGENT_EXCLUDED_CLASSES: "com.amazonaws.services.lambda.runtime.*"
#          OTEL_SKIP_RESOURCE_TELEMETRY_DEFINITION_CHECK: "true"
#          OTEL_INSTRUMENTATION_SPRING_INTEGRATION_ENABLED: "true"
          OTEL_INSTRUMENTATION_SPRING_CLOUD_FUNCTION_ENABLED: "true"
#          OTEL_INSTRUMENTATION_AWS_LAMBDA_ENABLED: "true"
          OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
#          OTEL_INSTRUMENTATION_HIBERNATE_ENABLED: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_ENABLED: "true"
#          OTEL_INSTRUMENTATION_METHODS_ENABLED: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_GENERATE_RPC_METRICS: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_EXPERIMENTAL_SPAN_ATTRIBUTES: true
          OTEL_INSTRUMENTATION_OKHTTP_ENABLED: "true"
#          OTEL_INSTRUMENTATION_JVM_METRICS_ENABLED: "true"
#          OTEL_INSTRUMENTATION_PROCESS_METRICS_ENABLED: "true"
#          OTEL_INSTRUMENTATION_PROCESS_RUNTIME_ENABLED: "true"
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !Sub "${AlloyUrl}/v1/traces"
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: !Sub "${AlloyUrl}/v1/metrics"
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: !Sub "${AlloyUrl}/v1/logs"
#          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !Sub "http://127.0.0.1:4318/v1/traces"
#          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: !Sub "http://127.0.0.1:4318/v1/metrics"
#          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: !Sub "http://127.0.0.1:4318/v1/logs"
#          OPENTELEMETRY_COLLECTOR_CONFIG_URI: env:ADOT_CONFIG_CONTENT
#          ADOT_CONFIG_CONTENT:
#            Fn::Sub:
#              - |
#                receivers:
#                  otlp:
#                    protocols:
#                      http:
#                        endpoint: "0.0.0.0:4318"
#                        tls:
#                          insecure: true
#                exporters:
#                  otlphttp:
#                    endpoint: "${AlloyUrl}"
#                service:
#                  pipelines:
#                    traces:
#                      receivers: [otlp]
#                      exporters: [otlphttp]
#                    metrics:
#                      receivers: [otlp]
#                      exporters: [otlphttp]
#                    logs:
#                      receivers: [otlp]
#                      exporters: [otlphttp]
#              - AlloyUrl: !Ref AlloyUrl
      Events:
        IssueVCN:
          Type: HttpApi
          Properties:
            Path: /cards/vcn
            Method: post
            ApiId: !Ref CardServiceApi
            PayloadFormatVersion: "1.0"
        GetRealCard:
          Type: HttpApi
          Properties:
            Path: /cards/real
            Method: get
            ApiId: !Ref CardServiceApi
            PayloadFormatVersion: "1.0"
        GetVCNs:
          Type: HttpApi
          Properties:
            Path: /cards/vcns
            Method: get
            ApiId: !Ref CardServiceApi
            PayloadFormatVersion: "1.0"

  CardServiceAccountCreatedListenerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: CardServiceAccountCreatedListenerFunction
      Tracing: Active
      VpcConfig: # ← REQUIRED for VPC access
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref KafkaSubnetId
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      CodeUri: .
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !If
          - IsArm64
          - !Sub arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroJava:9
          - !Sub arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroJava:9
#        - !If
#          - IsArm64
#          - !Sub arn:aws:lambda:us-east-1:184161586896:layer:opentelemetry-collector-arm64-0_19_0:1
#          - !Sub arn:aws:lambda:us-east-1:184161586896:layer:opentelemetry-collector-amd64-0_19_0:1
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: accountCreated
          MAIN_CLASS: com.portfolio.banking.cardservice.CardServiceApplication
          ALLOY_BASE_URL: !Ref AlloyUrl
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_INSTRUMENTATION_METHODS_INCLUDE: "org.springframework.cloud.function.adapter.aws.FunctionInvoker[handleRequest]"
#          OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED: "true"
          OTEL_SERVICE_NAME: "card-service-account-created-listener-function"
          OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
          OTEL_PROPAGATORS: "tracecontext,baggage,b3,xray"
          OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "false"
          OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
###          OTEL_EXPORTER_OTLP_TIMEOUT: "30000"
#          OTEL_EXPORTER_OTLP_ENDPOINT: !Ref AlloyUrl
#          OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:4318"
          OTEL_LOGS_EXPORTER: "otlp"
          OTEL_TRACES_EXPORTER: "otlp"
          OTEL_METRICS_EXPORTER: "otlp"
#          OTEL_LOGS_EXPORTER: "logging"
#          OTEL_TRACES_EXPORTER: "logging"
#          OTEL_METRICS_EXPORTER: "logging"
          OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "1"
          OTEL_BSP_SCHEDULE_DELAY: "10"
          OTEL_BLRP_SCHEDULE_DELAY: "10"
          OTEL_JAVAAGENT_LOGGING: "application"
#          OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
#          OTEL_TRACES_SAMPLER: "always_on"
#          OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
##          OTEL_EXPORTER_OTLP_CONNECT_TIMEOUT: 10000
##          OTEL_JAVAAGENT_ENABLED: true
##          OTEL_INSTRUMENTATION_AWS_LAMBDA_FLUSH_TIMEOUT: 10000
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
          OTEL_INSTRUMENTATION_JDBC_ENABLED: "true"
          OTEL_INSTRUMENTATION_JDBC_DATA_SOURCE_ENABLED: "true"
          OTEL_JAVAAGENT_DEBUG: "true"
          OTEL_LOG_LEVEL: "debug"
          OTEL_LAMBDA_DISABLE_AWS_CONTEXT_PROPAGATOR: "true"
          OPENTELEMETRY_EXTENSION_LOG_LEVEL: "debug"
          OTEL_INSTRUMENTATION_LOGGING_ENABLED: "true"
          OTEL_INSTRUMENTATION_SPRING_CLOUD_FUNCTION_ENABLED: "true"
          OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_ENABLED: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_GENERATE_RPC_METRICS: "true"
          OTEL_INSTRUMENTATION_AWS_SDK_EXPERIMENTAL_SPAN_ATTRIBUTES: true
#          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !Sub "${AlloyUrl}/v1/traces"
#          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: !Sub "${AlloyUrl}/v1/metrics"
#          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: !Sub "${AlloyUrl}/v1/logs"
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://127.0.0.1:55681/v1/traces"
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://127.0.0.1:55681/v1/metrics"
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://127.0.0.1:55681/v1/logs"
          OPENTELEMETRY_EXTENSION_SEND_AFTER_INVOKE: "true"
          OPENTELEMETRY_COLLECTOR_THROTTLING_EXIT_TIMEOUT: "2000"
          OTEL_INSTRUMENTATION_AWS_LAMBDA_FLUSH_TIMEOUT: 5000
          OPENTELEMETRY_COLLECTOR_CONFIG_URI: env:ADOT_CONFIG_CONTENT
#          ADOT_CONFIG_CONTENT:
#            Fn::Sub:
          ADOT_CONFIG_CONTENT: !Sub
            - |
              receivers:
                otlp:
                  protocols:
                    http:
                      endpoint: "127.0.0.1:55681"
              exporters:
                otlphttp:
                  endpoint: "${AlloyUrl}"
                  tls:
                    insecure: true
              service:
                pipelines:
                  traces:
                    receivers: [otlp]
                    exporters: [otlphttp]
                  metrics:
                    receivers: [otlp]
                    exporters: [otlphttp]
                  logs:
                    receivers: [otlp]
                    exporters: [otlphttp]
            - AlloyUrl: !Ref AlloyUrl
      Events:
        AccountCreated:
          Type: SelfManagedKafka
          Properties:
            KafkaBootstrapServers:
#              - !ImportValue banking-portfolio-core:KafkaBroker
              - !Ref KafkaBootstrapServers
            Topics:
              - !Ref KafkaTopic
            ConsumerGroupId: !Ref ConsumerGroupId
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            SourceAccessConfigurations: # ← REQUIRED when VpcConfig present
              - Type: VPC_SUBNET
                URI: !Ref KafkaSubnetId
              - Type: VPC_SECURITY_GROUP
                URI: !Ref LambdaSecurityGroupId

#  CardServiceApiFunctionVersion:
#    Type: AWS::Lambda::Version
#    Properties:
#      FunctionName: !Ref CardServiceApiFunction
#
#  CardServiceApiFunctionSnapStartAlias:
#    Type: AWS::Lambda::Alias
#    Properties:
#      FunctionName: !Ref CardServiceApiFunction
#      FunctionVersion: !GetAtt CardServiceApiFunctionVersion.Version
#      Name: "CardServiceApiFunctionSnapStartAlias"

#  CardServiceApiInvokePermission:
#    Type: AWS::Lambda::Permission
#    Properties:
#      Action: lambda:InvokeFunction
#      FunctionName: !Ref CardServiceApiFunction.Alias
#      Principal: apigateway.amazonaws.com
##        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/*/*"
#      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CardServiceApi}/*/*/*"

#  CardServiceApiIntegration:
#    Type: AWS::ApiGatewayV2::Integration
#    Properties:
#      ApiId: !Ref CardServiceApi
#      IntegrationType: AWS_PROXY
#      IntegrationUri: !Ref CardServiceApiFunction.Alias

  HttpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/projects/${AWS::StackName}-http-api"
      RetentionInDays: 7

  HttpApiLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-LogPolicy"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": "apigateway.amazonaws.com" },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "${HttpApiLogGroup.Arn}:*"
            }
          ]
        }

  CardServiceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: CardServiceApi
      StageName: Prod
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogGroup.Arn
        # This format string must be a single line
        Format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "integrationStatus":"$context.integrationStatus", "integrationErrorMessage":"$context.integrationErrorMessage", "integration.error":"$context.integration.error" }'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendIpAddress
          - !Ref FrontendCname
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: true  # Optional

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
#                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*!ImportValue banking-portfolio-core:DynamoDBTable*"
                Resource:
                  - !GetAtt CardsTable.Arn
                  - !GetAtt VirtualCardTokensTable.Arn
                  # Grant access to the GSI as well
                  - !Sub "${VirtualCardTokensTable.Arn}/index/*"
        - PolicyName: KafkaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kafka-cluster:Connect
                  - kafka-cluster:DescribeTopic
                  - kafka-cluster:ReadData
                  - kafka-cluster:DescribeGroup
                Resource: '*'
        - PolicyName: VPCAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: "*"
  CardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Cards
      AttributeDefinitions:
        - AttributeName: cardId
          AttributeType: S
      KeySchema:
        - AttributeName: cardId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  VirtualCardTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: VirtualCardTokens
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
        - AttributeName: realCardId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RealCardIdIndex
          KeySchema:
            - AttributeName: realCardId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcId: !Ref VpcId
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableId
  STSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcId: !Ref VpcId
      SubnetIds:
        - !Ref KafkaSubnetId
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
  LambdaEndpoint:  # For Lambda service
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcId: !Ref VpcId
      SubnetIds:
        - !Ref KafkaSubnetId
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTPS from Lambda
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

Outputs:
  CardServiceApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${CardServiceApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: !Sub "${AWS::StackName}:ApiUrl"   # Used by EB stack