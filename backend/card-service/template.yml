AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Card Service - Serverless (Lambda + API Gateway)

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java17
#    Architectures: [x86_64]
    Architectures: [!Ref Architecture]
    Environment:
      Variables:
        SPRING_PROFILES_ACTIVE: lambda
        DEPENDENCY_CHECK_SKIP: ''
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
        MAIN_CLASS: com.portfolio.banking.cardservice.CardServiceApplication

Parameters:
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [x86_64, arm64]
    Description: Operating System
  ShadedJarName:
    Type: String
#    Default: card-service-0.0.1-SNAPSHOT-lambda.jar
    Default: card-service-lambda.jar
    Description: Name of the shaded JAR in target/
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  KafkaBootstrapServers:
    Type: String
    Default: host.docker.internal:9092
    Description: Kafka bootstrap servers
  KafkaBootstrapServersExportName:
    Type: String
    Default: banking-portfolio-core:KafkaBroker
    Description: Kafka bootstrap servers export name
  KafkaTopic:
    Type: String
    Default: account-created
  ConsumerGroupId:
    Type: String
    Default: card-group
  KafkaAuthType:
    Type: String
    Default: SASL_SCRAM_512_AUTH
  KafkaAuthURI:
    Type: String
    Default: scram://host.docker.internal:9092
  VpcSubnetId:
    Type: String
    Default: subnet-local-dev  # Dev dummy
  VpcSecurityGroupId:
    Type: String
    Default: sg-local-dev  # Dev dummy

Conditions:
  IsDev: !Equals [ !Ref Environment, dev ]

Resources:
  CardServiceAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
#      CodeUri: !Sub "target/${ShadedJarName}"
      CodeUri: .
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          spring.cloud.function.definition: lambdaRouter
          AWS_DYNAMODB_ENDPOINT: !ImportValue banking-portfolio-core:DynamoDBTable
          MAIN_CLASS: com.portfolio.banking.cardservice.CardServiceApplication
          ACCOUNT_SERVICE_URL:
            Fn::If: [isDev, !Ref "AWS::NoValue", !ImportValue "banking-portfolio-eb:AccountEnvironmentURL"]
      Events:
        IssueVCN:
          Type: Api
          Properties:
            Path: /cards/vcn
            Method: post
            RestApiId: !Ref CardServiceApi
        GetRealCard:
          Type: Api
          Properties:
            Path: /cards/real
            Method: get
            RestApiId: !Ref CardServiceApi
        GetVCNs:
          Type: Api
          Properties:
            Path: /cards/vcns
            Method: get
            RestApiId: !Ref CardServiceApi

  CardServiceAccountCreatedListenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
#      CodeUri: !Sub "target/${ShadedJarName}"
      CodeUri: .
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          spring.cloud.function.definition: accountCreated
          AWS_DYNAMODB_ENDPOINT: !ImportValue banking-portfolio-core:DynamoDBTable
          MAIN_CLASS: com.portfolio.banking.cardservice.CardServiceApplication
      Events:
        AccountCreated:
#          Type: Kafka
          Type: SelfManagedKafka
          Properties:
            BootstrapServers: !If
              - IsDev
              - !Ref KafkaBootstrapServers
              - Fn::ImportValue: !Ref KafkaBootstrapServersExportName
            Topics:
              - !Ref KafkaTopic
            ConsumerGroupId: !Ref ConsumerGroupId
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            SourceAccessConfigurations: !If
            - IsDev
            - []  # No auth/VPC local
            -
              - Type: !Ref KafkaAuthType
                URI: !Ref KafkaBootstrapServers
              - Type: VPC_SUBNET
                URI: !Ref VpcSubnetId
              - Type: VPC_SECURITY_GROUP
                URI: !Ref VpcSecurityGroupId

  CardServiceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
    Name: !Sub "${AWS::StackName}-api"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
#                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*!ImportValue banking-portfolio-core:DynamoDBTable*"
                Resource: "*"
        - PolicyName: KafkaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kafka:*
                Resource: '*'

  Resources:
    CardsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Cards
        AttributeDefinitions:
          - AttributeName: cardId
            AttributeType: S
        KeySchema:
          - AttributeName: cardId
            KeyType: HASH
      BillingMode: PAY_PER_REQUEST

    VirtualCardTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: VirtualCardTokens
        AttributeDefinitions:
          - AttributeName: tokenId
            AttributeType: S
          - AttributeName: realCardId
            AttributeType: S
        KeySchema:
          - AttributeName: tokenId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: RealCardIdIndex
            KeySchema:
              - AttributeName: realCardId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

Outputs:
  CardServiceApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${CardServiceApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: !Sub "${AWS::StackName}:ApiUrl"   # Used by EB stack