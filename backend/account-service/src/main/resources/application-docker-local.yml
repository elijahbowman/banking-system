spring:
  application:
    name: account-service
  datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect:
  kafka:
    bootstrap-servers:

  h2:
    console:
      enabled: false
      path:
      settings:
        web-allow-others:

logging:
  level:
    org.springframework.boot.context: INFO
    com.portfolio.banking: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
    org.springframework.jdbc.datasource: INFO
#    io.awspring.cloud.paramstore: DEBUG
    logging:
      level:
        org:
          hibernate:
            type:
              descriptor:
                sql: INFO

  file:
    name: /app/logs/account-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans