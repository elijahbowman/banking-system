spring:
  application:
    name: account-service
  config:
    import: "aws-parameterstore:/banking/rds/"
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/bankingdb
    driver-class-name: org.postgresql.Driver
    username: bank_admin
    password: ${password}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER}

  h2:
    console:
      enabled: false
      path:
      settings:
        web-allow-others:

logging:
  level:
    io.awspring.cloud.paramstore.AwsParamStorePropertySource: INFO
#    org.springframework.boot.context.config.ConfigDataEnvironment: TRACE
    com.portfolio.banking: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
    org.springframework.jdbc.datasource: INFO
#    io.awspring.cloud.paramstore: DEBUG
    logging:
      level:
        org:
          hibernate:
            type:
              descriptor:
                sql: INFO

  file:
    name: /app/logs/account-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans