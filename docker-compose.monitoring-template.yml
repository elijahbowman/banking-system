version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: banking-prometheus
    ports: [9090:9090]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
    networks:
      - banking-network

  # alertmanager:
  #   image: prom/alertmanager:latest
  #   container_name: banking-alertmanager
  #   ports: [9093:9093]
  #   volumes:
  #     - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
  #   command:
  #     - '--config.file=/etc/alertmanager/alertmanager.yml'
  #     - '--storage.path=/alertmanager'
  #   networks:
  #     - banking-network

  grafana:
    image: grafana/grafana:latest
    # user: "501"
    container_name: banking-grafana
    ports: [3000:3000]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    # depends_on: [prometheus, loki, alertmanager]
    depends_on: [prometheus, loki]
    networks:
      - banking-network

  loki:
    image: grafana/loki:latest
    container_name: banking-loki
    ports: [3100:3100]
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - banking-network

  promtail:
    image: grafana/promtail:latest
    container_name: banking-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]
    networks:
      - banking-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: banking-zipkin
    ports:
      - "9411:9411"
    networks:
      - banking-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: banking-kafka-exporter
    ports: [9308:9308]
    command:
      - --kafka.server={KAFKA_URL}:9092
      - --topic.filter=.*
      - --group.filter=.*
      - --log.level=debug
    networks:
      - banking-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports: [9100:9100]
    networks:
      - banking-network

volumes:
  grafana_data:

networks:
  # banking-network:
  #   external: true
  banking-network:
    driver: bridge
    name: banking-network