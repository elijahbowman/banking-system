version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: banking-prometheus
    ports: [9090:9090]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.enable-remote-write-receiver'
    networks:
      - banking-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: banking-alertmanager
    ports: [9093:9093]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - banking-network

  grafana:
    image: grafana/grafana:latest
    # user: "501"
    container_name: banking-grafana
    ports: [3000:3000]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, alertmanager]
    networks:
      - banking-network

  loki:
    image: grafana/loki:latest
    container_name: banking-loki
    ports: [3100:3100]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - banking-network

  alloy:
    image: grafana/alloy:latest
    container_name: banking-alloy
    restart: always
    ports:
      - "4317:4317"   # OTLP gRPC (Lambda / ADOT)
      - "4318:4318"   # OTLP HTTP (Spring Boot 3.x+)
      - "9080:9080"   # Alloy UI (Optional)
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:9080",
      "--storage.path=/var/lib/alloy/data",
      "/etc/alloy/config.alloy"
    ]
    depends_on:
      - prometheus
      - loki
      - zipkin
    networks:
      - banking-network

  zipkin:
    image: ghcr.io/openzipkin-contrib/zipkin-otel:latest
    container_name: banking-zipkin
    # command: --logging.level.zipkin2=DEBUG -- zipkin.collector.otlp.enabled=true
    ports:
      - "9411:9411"
    networks:
      - banking-network
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: banking-kafka-exporter
    ports: [9308:9308]
    command:
      - --kafka.server=kafka:9092
      - --topic.filter=.*
      - --group.filter=.*
      - --log.level=debug
    networks:
      - banking-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports: [9100:9100]
    networks:
      - banking-network

volumes:
  grafana_data:
  alloy_data:

networks:
  banking-network:
    external: true